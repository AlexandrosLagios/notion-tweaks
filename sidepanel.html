<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Inbox</title>
    <style>
      :root {
        color-scheme: light dark;
        --surface: light-dark(#ffffff, #191919);
        --text: light-dark(#37352f, #d4d4d4);
        --muted: light-dark(#787774, #9b9b9b);
        --line: light-dark(#37352f14, #ffffff14);
        --hover: light-dark(#37352f0a, #ffffff0a);
        --accent: #2383e2;
      }
      body { margin: 0; font: 14px/1.4 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--surface); color: var(--text); }
      .panel { box-sizing: border-box; height: 100vh; overflow-y: auto; padding: 12px 14px; }
      header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
      header strong { flex: 1; font-size: 15px; white-space: nowrap; }
      .badge { margin-left: 6px; padding: 1px 6px; border-radius: 9px; font-size: 11px; color: #fff; background: var(--accent); }
      summary { display: flex; align-items: center; gap: 8px; padding: 6px 0; cursor: pointer; font-weight: 600; }
      summary::before { content: '▸'; color: var(--muted); }
      details[open] > summary::before { content: '▾'; }
      .count { flex: 1; font-size: 12px; font-weight: 400; color: var(--muted); }
      ul { list-style: none; margin: 0 0 8px; padding: 0; }
      li { position: relative; min-height: 56px; padding: 6px 8px 6px 16px; border-top: 1px solid var(--line); }
      li:hover { background: var(--hover); }
      li.unread::before { content: ''; position: absolute; left: 5px; top: 13px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
      li.unread a { font-weight: 600; }
      li.current { background: var(--hover); box-shadow: inset 2px 0 0 var(--accent); }
      li.archived a, li.archived small, li.archived .preview { opacity: 0.4; }
      .row { display: flex; align-items: flex-start; gap: 8px; }
      a { flex: 1; min-width: 0; color: inherit; text-decoration: none; overflow-wrap: anywhere; }
      a::after { content: ''; position: absolute; inset: 0; }
      .age { min-width: 62px; font-size: 12px; line-height: 20px; text-align: right; color: var(--muted); }
      button, select, input { font: inherit; font-size: 12px; padding: 2px 8px; cursor: pointer; color: inherit; background: transparent; border-radius: 4px; border: 1px solid light-dark(#37352f33, #ffffff33); }
      .row-actions { position: absolute; top: 3px; right: 8px; z-index: 1; display: flex; flex-direction: column; gap: 1px; opacity: 0; }
      .row-actions button, .row-actions select { background: var(--surface); }
      .row-actions button { min-width: 62px; padding: 1px 8px; }
      .row-actions select { width: 62px; padding: 1px 0 1px 4px; }
      li:hover .row-actions, .row-actions:focus-within, li.archived .row-actions { opacity: 1; }
      .action-needed > summary > span:first-child { color: var(--accent); }
      li.archived .age { visibility: hidden; }
      small { display: block; font-size: 12px; color: var(--muted); }
      small::first-letter { text-transform: uppercase; }
      .preview { display: -webkit-box; margin: 2px 0 0; overflow: hidden; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
      .error { color: #e03e3e; }
      dialog { box-sizing: border-box; width: min(280px, calc(100vw - 32px)); border: 1px solid var(--line); border-radius: 6px; color: inherit; background: var(--surface); }
      dialog label { display: block; margin-bottom: 6px; font-weight: 600; }
      dialog input { box-sizing: border-box; width: 100%; padding: 4px 8px; font-size: 14px; cursor: text; }
      .space { min-width: 0; max-width: 40%; text-overflow: ellipsis; }
      .dialog-actions { display: flex; flex-direction: row-reverse; gap: 8px; margin-top: 10px; }
      dialog textarea { box-sizing: border-box; width: 100%; margin-bottom: 8px; padding: 4px 8px; font: inherit; color: inherit; background: transparent; border-radius: 4px; border: 1px solid light-dark(#37352f33, #ffffff33); resize: vertical; }
      .dialog-title { margin: 0 0 8px; color: var(--muted); overflow-wrap: anywhere; }
      li.can-reply { min-height: 80px; }
      #reply-later { width: min(320px, calc(100vw - 32px)); }
      .scheduled > summary > span:first-child { color: #d9730d; }
      li.overdue::before, li.failed::before { content: ''; position: absolute; left: 5px; top: 13px; width: 6px; height: 6px; border-radius: 50%; background: #d9730d; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <dialog id="new-group">
      <form method="dialog">
        <label for="new-group-name">Group name</label>
        <input id="new-group-name" required pattern=".*\S.*" autocomplete="off" />
        <div class="dialog-actions">
          <button value="create">Create</button>
          <button value="" formnovalidate>Cancel</button>
        </div>
      </form>
    </dialog>
    <dialog id="reply-later">
      <form method="dialog">
        <p class="dialog-title"></p>
        <label for="reply-text">Reply</label>
        <textarea id="reply-text" rows="4" required></textarea>
        <div class="picker-slot"></div>
        <p class="error" hidden></p>
        <div class="dialog-actions">
          <button value="schedule">Schedule</button>
          <button value="" formnovalidate>Cancel</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="src/sidepanel.js"></script>
  </body>
</html>
